services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: fund
      POSTGRES_PASSWORD: fund
      POSTGRES_DB: fund
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fund"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  pgdata:
